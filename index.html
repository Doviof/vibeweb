<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f0e9" />
    <meta
      name="description"
      content="EN ROUTE，一本关于日常、远行和片刻停留的私人影像日记。"
    />
    <meta property="og:title" content="EN ROUTE" />
    <meta
      property="og:description"
      content="日常、远行，和一些不想忘记的片刻。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>EN ROUTE</title>
    <script>
      try {
        var theme = localStorage.getItem("en-route-theme");
        document.documentElement.dataset.theme =
          theme === "dark" ? "dark" : "light";
      } catch (_) {
        document.documentElement.dataset.theme = "light";
      }
      document.querySelector('meta[name="theme-color"]').content =
        document.documentElement.dataset.theme === "dark" ? "#0b0b0c" : "#f3f0e9";
    </script>
    <script>
      try {
        var language = localStorage.getItem("en-route-language");
        document.documentElement.lang =
          language === "en" || language === "ja" ? language : "zh-CN";
      } catch (_) {
        document.documentElement.lang = "zh-CN";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
